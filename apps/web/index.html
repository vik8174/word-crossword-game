<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Across the Street</title>

    <!-- Alegreya Sans, the one face of the app, in three files: 400, 700 and
      400 italic, latin only. Which role each plays, and why the face is worth
      its bytes, is in src/scale.ts.

      Two of them are preloaded: the 400 and the 700. The text face is read on
      every screen after the landing page, and a face that lands after that
      screen has been laid out moves what somebody has already begun reading
      (issue #124); on the landing page itself the name of the game is set in
      the 700, so a request that only started after first paint would swap it
      out from under somebody reading it (issue #115). The italic is declared
      and not preloaded: the landing page draws none, so it arrives when a
      screen first draws italic text (the explained squares, the lobby, the
      endings, street cards, the info glyph of a message), and that text may
      show in the regular face for a moment first (issue #263).

      Every declared face is counted against the ceiling a first visit may not
      go over, except the ones named in NOT_ON_FIRST_VISIT, which is the italic
      alone, and only while it is not preloaded
      (apps/web/build/first-visit-weight.ts). Every unicode-range below is
      LATIN_RANGE (src/font-faces.ts); the test beside it fails when they
      differ. -->
    <link
      rel="preload"
      href="/fonts/alegreya-sans-v28-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/alegreya-sans-v28-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Alegreya Sans, SIL Open Font License 1.1 — /fonts/OFL.txt. */
      @font-face {
        font-family: 'Alegreya Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/alegreya-sans-v28-latin-400.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Alegreya Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/alegreya-sans-v28-latin-700.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Alegreya Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/alegreya-sans-v28-latin-400italic.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
