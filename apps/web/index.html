<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Crossword Game</title>

    <!-- The two faces this app has files for. Which is which, and why either is
      worth any bytes, is in src/scale.ts.

      Both are preloaded. The sign face was not when it arrived, and for a good
      reason at the time — nothing in the interface asked for it. The garden
      does now: the landing page is a gate with the name of the game lettered
      over it, so the one thing on the first screen is set in this face, and a
      face fetched after the first paint would swap that name out from under
      somebody reading it (issue #115). Both files are counted against the
      ceiling a first visit may not go over, preloaded or not
      (apps/web/build/first-visit-weight.ts). -->
    <link
      rel="preload"
      href="/fonts/zen-old-mincho-v13-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/zen-kaku-gothic-new-v18-latin-300.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Zen Old Mincho, SIL Open Font License 1.1 — /fonts/OFL.txt */
      @font-face {
        font-family: 'Zen Old Mincho';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/zen-old-mincho-v13-latin-400.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Zen Kaku Gothic New, SIL Open Font License 1.1 — /fonts/OFL.txt */
      @font-face {
        font-family: 'Zen Kaku Gothic New';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url('/fonts/zen-kaku-gothic-new-v18-latin-300.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
