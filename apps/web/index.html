    <title>Across the Street</title>

    <!-- Alegreya Sans, the one face of the app, in six files: 400, 700 and
      400 italic, each in the latin range and in the latin-ext range. Which role
      each plays, and why the face is worth its bytes, is in src/scale.ts.

      Two of them are preloaded: the latin 400 and the latin 700. The text face
      is read on every screen after the landing page, and a face that lands after that
      screen has been laid out moves what somebody has already begun reading
      (issue #124); on the landing page itself the name of the game is set in
      the 700, so a request that only started after first paint would swap it
      out from under somebody reading it (issue #115). The italic is declared
      and not preloaded: the landing page draws none, so it arrives when a
      screen first draws italic text (the explained squares, the lobby, the
      endings, street cards, the info glyph of a message), and that text may
      show in a system face for a moment first (issue #263).

      The three latin-ext files are declared and never preloaded. A browser
      fetches one only when a page draws a letter of LATIN_EXT_RANGE in its
      weight and style (a word like "łódź" or "ősz"), and the landing page draws
      none. The words of a game may use any letter of the two ranges (issue
      #232).

      Every declared face is counted against a ceiling, by its range
      (apps/web/build/first-visit-weight.ts): a face that shares a code point
      with LATIN_RANGE, or declares no range, or is preloaded, against the
      ceiling a first visit may not go over; the latin-ext faces against a
      ceiling of their own. The one exception is NOT_ON_FIRST_VISIT, the latin
      italic alone, and only while it is not preloaded. Every unicode-range
      below is LATIN_RANGE or LATIN_EXT_RANGE (packages/shared/src/font-ranges);
      src/font-faces.test.ts fails when they differ. -->
    <link
      rel="preload"
      href="/fonts/alegreya-sans-v28-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/alegreya-sans-v28-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
