<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Garden</title>

    <!-- The two families this app has files for, in four files: Zen Kaku
      Gothic New in three weights, and Dela Gothic One in one — subset to the
      eight glyphs of `WORD GARDEN` and a space. Which of them plays which
      role, and why any of them is worth its bytes, is in src/scale.ts.

      All four families are preloaded. The sign face (300) was not when it
      arrived, and for a good reason at the time — nothing in the interface
      asked for it. The garden changed that: the landing page is a gate with
      the name of the game lettered over it, so the one thing on the first
      screen is set in this face, and a face fetched after the first paint
      would swap that name out from under somebody reading it (issue #115).
      The text face (400, 700) is preloaded for the same reason one step
      later: nothing on the landing page is set in it, but everything read on
      the screen after it is, and a face that lands after that screen has been
      laid out moves what somebody has already begun reading — nineteen and a
      half pixels of it, measured (issue #124). Issue #147 moved the
      crossword's letters onto the 400 here too, off a serif whose stroke
      contrast lost first at the sizes the board draws at.

      Dela Gothic One is preloaded for the same reason as the sign face
      before it: issue #148 put the name of the game over the gates in this
      face, the one thing the first screen is lettered in, so a request that
      only started after first paint would swap the name out from under
      somebody already reading it — the same trap the sign face was declared
      ahead of before anything named it (issue #115).

      Every file here is counted against the ceiling a first visit may not go
      over, preloaded or not (apps/web/build/first-visit-weight.ts). -->
    <link
      rel="preload"
      href="/fonts/zen-kaku-gothic-new-v18-latin-300.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/zen-kaku-gothic-new-v18-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/zen-kaku-gothic-new-v18-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dela-gothic-one-v19-word-garden-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Zen Kaku Gothic New, SIL Open Font License 1.1 — /fonts/OFL.txt.
         One family in three weights: the light is the lettering on the
         signs, and the other two — issue #147's regular and bold — are the
         text of the interface and its four heading levels alike. */
      @font-face {
        font-family: 'Zen Kaku Gothic New';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url('/fonts/zen-kaku-gothic-new-v18-latin-300.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Zen Kaku Gothic New';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/zen-kaku-gothic-new-v18-latin-400.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Zen Kaku Gothic New';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/zen-kaku-gothic-new-v18-latin-700.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Dela Gothic One, SIL Open Font License 1.1 — /fonts/OFL.txt.
         The logotype: `WORD GARDEN`, and nothing else. Subset to the eight
         letters that spell it plus a space — W O R D G A E N — rather than
         to latin at large, which is why it costs a fraction of a kibibyte
         instead of the 15.9 KB a full latin cut of a display face runs to. */
      @font-face {
        font-family: 'Dela Gothic One';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/dela-gothic-one-v19-word-garden-400.woff2') format('woff2');
        unicode-range: U+0020, U+0041, U+0044-0045, U+0047, U+004E-004F, U+0052, U+0057;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
