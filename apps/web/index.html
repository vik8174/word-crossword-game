<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Crossword Game</title>

    <!--
      The one typeface this app fetches: the crossword's letters and its large
      headings. Why it is worth any bytes, and why it is served from here rather
      than from a font host, is with DISPLAY_FONT_FAMILY in src/theme.ts.
    -->
    <link
      rel="preload"
      href="/fonts/zen-old-mincho-v13-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Zen Old Mincho, SIL Open Font License 1.1 — /fonts/OFL.txt */
      @font-face {
        font-family: 'Zen Old Mincho';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/zen-old-mincho-v13-latin-400.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
