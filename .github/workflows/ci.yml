name: CI

# Pull requests only. What lands on `main` is checked again by `deploy.yml`,
# on the very commit it deploys, so running the same suite here on push would
# be the same work twice.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm -r build` covers both packages: `tsc --noEmit && vite build`
      # for web, `tsc -b` for shared.
      - run: pnpm build

  rules:
    name: Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The Firestore emulator runs on the JVM. `firebase-tools` drops support
      # for Java below 21 in its next major version.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # `pnpm test:rules` starts the emulator, runs firestore/rules.test.mjs
      # against firestore.rules and shuts the emulator down again.
      - run: pnpm test:rules
