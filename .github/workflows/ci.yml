name: CI

# Pull requests only. What lands on `main` is checked again by `deploy.yml`,
# on the very commit it deploys, so running the same suite here on push would
# be the same work twice.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm -r build` covers both packages: `tsc --noEmit && vite build`
      # for web, `tsc -b` for shared.
      - run: pnpm build

  rules:
    name: Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The Firestore emulator runs on the JVM. `firebase-tools` drops support
      # for Java below 21 in its next major version.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # `pnpm test:rules` starts the emulator, runs firestore/rules.test.mjs
      # against firestore.rules and shuts the emulator down again.
      - run: pnpm test:rules

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The Firestore and Auth emulators run on the JVM, as in the Rules job.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # The browser is cached by the Playwright version, so a run downloads it
      # only when the version moves. The system libraries are installed either way.
      - id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      # The emulator hook must not reach a deployed bundle: three builds with
      # dummy values (plain, stage, production) are searched for the emulator's
      # addresses, and an e2e build is searched to show the search can see them.
      - run: pnpm check:emulator-leak
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: e2e-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  visual:
    name: Visual
    runs-on: ubuntu-latest
    # Baselines are made in this image and only in this image (see CONTRIBUTING.md):
    # the tag must be the Playwright version in apps/web/package.json, which the
    # first step checks.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7.0.1
      # `job.container.image` is not available to a step, so the image line is
      # read from this file, the one the job was started from.
      - name: Image matches the Playwright version
        run: |
          want="mcr.microsoft.com/playwright:v$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")-noble"
          have="$(awk '$1 == "image:" && $2 ~ /^mcr.microsoft.com\/playwright:/ {print $2}' .github/workflows/ci.yml)"
          if [ "$want" != "$have" ]; then
            echo "::error::the job runs '$have' but apps/web/package.json needs '$want'"
            exit 1
          fi
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build-storybook
      - run: pnpm --filter web test:visual
      - if: failure()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: visual-diffs
          path: |
            apps/web/test-results-visual/
            apps/web/playwright-report/
          retention-days: 14
