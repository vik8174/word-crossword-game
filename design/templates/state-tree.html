<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Across the Street: state tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!--
  Across the Street (the app was Word Garden until 2026-10-14), design v2. Every screen and every state of the app.
  Drawn by the Architect on 2026-10-14 from variant L (handoffs/design-v2/r2-fd-3.html),
  chosen by Viktor the same day (issue #219). The states and every line of UI copy are
  taken from the previous template (design/templates/state-tree.html); nothing of its look is.

  Revision 2, 2026-10-14, on Viktor's review:
  - every screen is drawn at 1440, 834 and 375 at once ("all three", the default)
  - the street is Andalusian: whitewash, terracotta eaves, iron balconies, geraniums, azulejos;
    the people have faces and react to the game (explain, listen, wave, cheer, calm)
  - the lesson (ADR 0037): a mode on /create, a teacher who deals and watches, the lesson summary
  - a wrong word list is said inside the field (option B of three, Viktor's choice)

  Query string:  ?state=<key> ?mode=pair|lesson ?role=host|guest ?size=few|many
                 ?width=all|1440|834|375 ?bare
  ?bare fills the window with the app alone, at the window's own size, for capture.

  Tokens                         Contrast, WCAG, computed from the hex values
  duck    #E6EEEC  ground        ink on duck      12.04:1
  tile    #FAFBFA  squares, cards ink on tile     13.69:1
  ink     #1B2D38  text, outlines slate on duck    5.48:1   hints on the ground (the lowest)
  slate   #4C6170  secondary      slate on tile    6.23:1
  spruce  #2D6658  the action     slate on wash    5.10:1   a number on the word being filled
  ochre   #F2C766  lit window     white on spruce  6.66:1   the action's label
  wash    #F6E3B4  word filling   brick on tile    6.33:1   error text in a card
  rose    #E9CBC1  the refused square              brick on duck    5.57:1   the refusal line under the board
  stone   #C5D8D6  drawing only   spruce on duck   5.65:1   "answered" in the lists
  line    #C3D0CD  rules          ink on rose      9.31:1   a refused square, a fault strip, a wrong word tile
  brick   #A33A2C  refusal, error ink on wash     11.20:1   the disabled button: #3E5058 on #BFCBC8, 5.05:1
  sage    #D3E8DD  an answered square: ink on sage 11.06:1, its number slate on sage 5.03:1
  fiesta  #B23A28  the finished card: white on fiesta 5.95:1. Its words are in the interface's language.
  paper   #EFE6D2  a word you explain, on your board: ink on paper 11.44:1 (it was slate on nothing)
  The teacher's board: ink on wash 11.20:1 (Olena's words), ink on stone 9.58:1 (Taras's words).
  Drawing only, never text: whitewash #FBF7EE, shade #EDE3D2, terracotta #C2603A,
  azulejo #2E5C8A, geranium #C8412E, pot #B4643C, leaf #3F7A4E, skin #E9B892 #C08A62 #8E5E40.

  Type: Alegreya Sans 400, 700, 400 italic. Scale 56 / 34 / 22 / 18 / 16 / 14.
  The scaffolding (the bar above, the state tree, the note) is the template's, not the app's.
-->
<style>
:root{
  --duck:#E6EEEC; --tile:#FAFBFA; --ink:#1B2D38; --slate:#4C6170; --spruce:#2D6658;
  --ochre:#F2C766; --wash:#F6E3B4; --rose:#E9CBC1; --stone:#C5D8D6; --line:#C3D0CD; --brick:#A33A2C; --sage:#D3E8DD; --paper:#EFE6D2; --fiesta:#B23A28;
  --face:'Alegreya Sans','Gill Sans','Trebuchet MS',sans-serif;
  --chrome:#2B3236; --chrome-fg:#E8EDEC; --chrome-dim:#A9B6B4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#CBD5D3;color:var(--ink);font-family:var(--face);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ===================== scaffolding: the template's own, not the app's ===================== */
.tpl-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;background:var(--chrome);color:var(--chrome-fg);font:14px/1.3 system-ui,sans-serif}
.tpl-bar b{font-weight:600}
.tpl-bar .grp{display:flex;gap:4px;align-items:center}
.tpl-bar .grp span{color:var(--chrome-dim);margin-right:4px}
.tpl-bar button{font:13px system-ui,sans-serif;background:transparent;color:var(--chrome-fg);border:1px solid #56626A;border-radius:6px;padding:4px 9px;cursor:pointer}
.tpl-bar button[aria-pressed="true"]{background:var(--chrome-fg);color:var(--chrome)}
.tpl-where{margin-left:auto;color:var(--chrome-dim)}
.tpl-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;padding:16px}
.tpl-map{font:13px/1.35 system-ui,sans-serif;background:#EEF2F1;border:1px dashed #8A9997;border-radius:8px;padding:10px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.map-head{margin:0 0 6px;font-weight:600;color:#3D4A4F}
.map-group{margin:8px 0 2px;color:#5D6B70;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.node{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 6px;border-radius:5px;cursor:pointer;color:#1F2A2E;font:13px system-ui,sans-serif}
.node.sub{padding-left:16px;color:#4A575B}
.node.here{background:var(--chrome);color:var(--chrome-fg)}
.tpl-stage{min-width:0}
.tpl-note{font:14px/1.5 system-ui,sans-serif;color:#2F3A3E;background:#EEF2F1;border:1px dashed #8A9997;border-radius:8px;padding:10px 14px;margin-top:12px;max-width:1440px}
.tpl-note p{margin:0}
.stage{height:var(--stage-h,900px);position:relative}
html.bare body{background:var(--duck)}
html.bare .tpl-bar,html.bare .tpl-map,html.bare .tpl-note{display:none}
html.bare .tpl-body{display:block;padding:0}
html.bare .stage{height:100vh}

/* ===================== the app ===================== */
.device{position:absolute;left:0;top:0;width:var(--device-w);height:var(--device-h);transform:scale(var(--device-scale,1));transform-origin:0 0;
  background:var(--duck);overflow:hidden;box-shadow:0 0 0 1px #9FB0AD}
html.bare .device{box-shadow:none}
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--duck)}
.screen.fade-in{animation:fadeIn 180ms ease-out both}
.screen.shift-in{animation:shiftIn 180ms ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shiftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.btn.loading .dot{animation:none}}
/* the fiesta: a crossword filled in is celebrated the way an Andalusian street celebrates */
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.fiesta{position:relative;overflow:hidden;background:var(--fiesta);color:#fff;border-radius:14px;padding:44px 22px 22px;box-shadow:0 0 0 1.5px var(--ink),4px 4px 0 0 var(--ink);
  background-image:radial-gradient(rgba(255,255,255,.16) 3.5px,transparent 4px);background-size:20px 20px;background-position:10px 10px}
.fiesta .flags{position:absolute;left:0;right:0;top:0;height:30px;display:flex;justify-content:space-around}
.fiesta .flag{width:22px;height:26px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0}
.fiesta .ole{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.01em}
.fiesta p{margin-top:8px;font-size:18px;color:#fff}
.fiesta .tags{margin-top:14px}
.fiesta .tag-word{color:var(--ink)}

h1,h2,h3,p{margin:0}
.wordmark{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.wordmark-link{color:inherit;text-decoration:none;border-radius:6px}
.wordmark-link:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.wordmark-link:focus-visible{outline:3px solid var(--ochre);outline-offset:4px}
.wordmark::before{content:"";width:16px;height:16px;border-radius:3px;background:var(--tile);box-shadow:0 0 0 1.5px var(--ink),2px 2px 0 0 var(--ink);transform:rotate(-6deg)}
.title{font-weight:700;font-size:88px;line-height:.95;letter-spacing:-.015em}
.lede{font-size:24px;color:var(--slate);line-height:1.4}
.step-title{font-size:34px;font-weight:700;line-height:1.1}
.h3{font-size:22px;font-weight:700;line-height:1.3}
.hint{color:var(--slate);font-size:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-tight{display:flex;flex-direction:column;gap:10px}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* buttons: one loud action per screen, never the irreversible one */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:20px;line-height:1;border:0;background:var(--spruce);color:#fff;
  min-height:52px;padding:0 28px;border-radius:12px;cursor:pointer;box-shadow:0 0 0 1.5px var(--ink),3px 3px 0 0 var(--ink);white-space:nowrap}
.btn .dot{display:none;width:10px;height:10px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 1.5px var(--ink)}
.btn.loading .dot{display:inline-block;animation:pulse 900ms ease-in-out infinite alternate}
.btn.loading{cursor:progress}
@keyframes pulse{from{transform:scale(.7);opacity:.6}to{transform:scale(1.15);opacity:1}}
.btn:disabled{background:#BFCBC8;color:#3E5058;box-shadow:0 0 0 1.5px #8A9997;cursor:not-allowed}
.btn.quiet{background:var(--tile);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);font-size:17px;min-height:44px;padding:0 18px}
.btn.quiet.loading{background:var(--tile)}
.btn.link{background:none;box-shadow:none;color:var(--slate);font-weight:400;font-size:17px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn.sm{font-size:14px;min-height:34px;padding:0 10px;font-weight:400}
.btn:focus-visible{outline:3px solid var(--ochre);outline-offset:4px}
.btn.tpl{font:13px system-ui,sans-serif;background:#EEF2F1;color:#2F3A3E;box-shadow:none;border:1px dashed #8A9997;min-height:30px;padding:0 9px;border-radius:6px}

/* messages: a card with a mark; what kind it is is written, never only coloured */
.msg{display:flex;gap:14px;background:var(--tile);border-radius:12px;padding:16px 18px;box-shadow:0 0 0 1.5px var(--ink)}
.msg .mark{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--tile)}
.msg.warning .mark{background:var(--ochre)}
.msg.warning .mark::before{content:"!"}
.msg.error .mark{background:var(--rose)}
.msg.error .mark::before{content:"×"}
.msg.success .mark{background:var(--spruce);color:#fff}
.msg.success .mark::before{content:"✓"}
.msg.info .mark::before{content:"i";font-style:italic}
.msg .msg-body{flex:1;min-width:0}
.msg .head{display:block;font-weight:700;font-size:19px;margin-bottom:2px}
.msg.error .head{color:var(--brick)}
.msg p{font-size:17px;color:var(--ink)}
.msg ul{margin:6px 0 0;padding-left:20px;font-size:17px}

/* fields */
.field-set{display:flex;flex-direction:column;gap:6px}
.field-set label{font-weight:700;font-size:17px}
.field{display:block;background:var(--tile);border-radius:12px;box-shadow:0 0 0 1.5px var(--ink);padding:0}
.field input,.field textarea{width:100%;border:0;background:transparent;font:inherit;font-size:19px;color:var(--ink);padding:12px 16px;border-radius:12px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:none}
.field:has(input:focus-visible),.field:has(textarea:focus-visible){outline:3px solid var(--ochre);outline-offset:3px}
.field.invalid{box-shadow:0 0 0 3px var(--brick)}
.field.locked{opacity:.75}
.field.readonly input{font-size:17px}
.field-help{font-size:15px;color:var(--slate)}
.field-help.bad{color:var(--brick);font-weight:700}
.inline-status{font-size:16px}
.inline-status.ok{color:var(--spruce);font-weight:700}
.inline-status.ok::before{content:"✓ "}
.inline-status.bad{color:var(--brick)}

/* players */
.players{list-style:none;margin:8px 0 0;padding:0}
.players li{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1.5px solid var(--line)}
.players li:last-child{border-bottom:1.5px solid var(--line)}
.players .mk{width:11px;height:11px;border-radius:50%;flex:none;align-self:center;background:var(--ochre);box-shadow:0 0 0 1.5px var(--ink)}
.players .mk.away{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.players .mk.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--slate);border:0;opacity:.7}
.players .nm{font-size:21px;font-weight:700}
.players .tag{font-size:15px;color:var(--slate)}
.players .away-t{margin-left:auto;font-size:15px;color:var(--slate);font-style:italic}
.players .open{font-size:17px;color:var(--slate);font-style:italic}

/* word lists */
.word-list{list-style:none;margin:10px 0 0;padding:0}
.word-list li{border-top:1.5px solid var(--line)}
.word-list li:last-child{border-bottom:1.5px solid var(--line)}
.word-list button{display:flex;align-items:baseline;gap:12px;width:100%;background:none;border:0;padding:10px 2px;text-align:left;cursor:pointer;color:var(--ink);min-height:44px}
.word-list .ref{width:74px;flex:none;color:var(--slate);font-size:15px}
.word-list .word{font-style:italic;font-size:22px}
.word-list .state{margin-left:auto;font-size:15px;color:var(--slate)}
.word-list .done .state{color:var(--spruce);font-weight:700}
.word-list .done .state::before{content:"✓ "}
.word-list .slots{letter-spacing:.2em;font-size:20px}
.count-line{margin-top:10px;font-size:16px;color:var(--slate)}

/* the board: the same tiles that hang on the line between the windows */
.board-box{display:flex;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--sq));grid-template-rows:repeat(var(--rows),var(--sq));gap:var(--gap)}
.cell{position:relative;display:block;border-radius:5px;background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--ink),2px 2px 0 0 rgba(27,45,56,.22);
  display:grid;place-items:center;font-size:calc(var(--sq)*.58);line-height:1;padding-bottom:6%}
.cell.off{background:none;box-shadow:none}
.cell .num{position:absolute;top:3px;left:4px;font-size:max(9px,calc(var(--sq)*.25));font-weight:700;line-height:1;color:var(--slate)}
.cell.guessed{font-weight:700;background:var(--sage);box-shadow:inset 0 0 0 2px var(--spruce),2px 2px 0 0 rgba(27,45,56,.22)}
.cell.guessed::after{content:"";position:absolute;right:12%;bottom:14%;width:18%;height:9%;border-left:2px solid var(--spruce);border-bottom:2px solid var(--spruce);transform:rotate(-45deg)}
.cell.explained{background:var(--paper);box-shadow:2px 2px 0 0 rgba(27,45,56,.22);outline:1.5px dashed var(--ink);outline-offset:-1.5px;font-style:italic;color:var(--ink)}
.cell.filling{background:var(--wash)}
.cell.refused{background:var(--rose);color:var(--ink);font-weight:700}
.cell.refused::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:var(--brick);transform:rotate(-14deg)}
.cell.cursor{z-index:1;box-shadow:inset 0 0 0 3px var(--spruce),2px 2px 0 0 var(--ink)}
.cell.cursor::before{content:"";position:absolute;left:30%;right:30%;bottom:15%;height:2.5px;border-radius:2px;background:var(--spruce)}
.board-head{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;text-align:center}
.board-head h3{font-size:20px;font-weight:700}
.board-head p{font-size:16px;color:var(--slate)}
.board-notes{max-width:560px;margin:16px auto 0;display:flex;flex-direction:column;gap:6px}
.board-note{font-size:15px;color:var(--slate);text-align:center}
.board-note.refusal{color:var(--brick);font-weight:700;font-size:17px}

/* the drawing */
.scene svg{display:block;width:100%;height:auto}

/* the room's frame */
.app-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;min-height:64px;padding:10px var(--pad);background:var(--duck);border-bottom:1.5px solid var(--line)}
.app-head .status{flex:1;min-width:0;font-size:16px;color:var(--slate);text-align:center;text-wrap:balance}
.app-head .action{flex:none}
.body{padding:24px var(--pad) 40px}
.device[data-layout="wide"]{--pad:48px}
.device[data-layout="tablet"]{--pad:32px}
.device[data-layout="phone"]{--pad:18px}
.device[data-layout="phone"] .app-head .status{display:none}
.device[data-layout="phone"] .app-head{justify-content:space-between}

.zones{display:grid;gap:40px;grid-template-columns:290px minmax(0,1fr) 290px;align-items:start}
.zones > *{min-width:0}
.device[data-layout="tablet"] .zones{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.device[data-layout="tablet"] .zone-middle{grid-column:1/-1;order:-1}
.device[data-layout="phone"] .zones{grid-template-columns:minmax(0,1fr);gap:28px}
.device[data-layout="phone"] .zone-middle{order:-1}
.device[data-layout="phone"] .zone.left{order:2}
.device[data-layout="phone"] .zone.right{order:1}
.device[data-layout="phone"] .zones.teacher .zone.left{order:1}
.device[data-layout="phone"] .zones.teacher .zone.right{order:2}
.zone.empty{display:block}
.device[data-layout="phone"] .zone.empty{display:none}
.lobby-grid{display:grid;gap:56px;grid-template-columns:420px minmax(0,1fr);align-items:start}
.device[data-layout="tablet"] .lobby-grid,.device[data-layout="phone"] .lobby-grid{grid-template-columns:minmax(0,1fr);gap:28px}
.device[data-layout="tablet"] .lobby-grid .lobby-picture,.device[data-layout="phone"] .lobby-grid .lobby-picture{order:-1}

/* screens without a room: the street, the form, the notice */
.street{display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:64px;align-items:center;min-height:calc(100% - 64px);padding:24px var(--pad) 120px;position:relative}
.device[data-layout="tablet"] .street,.device[data-layout="phone"] .street{grid-template-columns:minmax(0,1fr);gap:24px;padding-bottom:40px}
.device[data-layout="tablet"] .street .scene,.device[data-layout="phone"] .street .scene{order:-1;max-width:560px;margin:0 auto;width:100%}
.device[data-layout="phone"] .title{font-size:54px}
.device[data-layout="phone"] .lede{font-size:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:40px;position:absolute;left:var(--pad);bottom:44px}
.device[data-layout="tablet"] .steps,.device[data-layout="phone"] .steps{position:static;flex-direction:column;gap:12px}
.steps li{font-size:17px;color:var(--slate);max-width:240px;display:flex;gap:12px;align-items:baseline}
.steps b{flex:none;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;font-size:16px;color:var(--ink);background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--ink)}
.column{max-width:560px;margin:0 auto;padding:48px var(--pad) 48px}
.device[data-layout="phone"] .column{padding-top:24px}
.column .scene{max-width:440px;margin:0 auto 28px}
.wait-line{display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px}
.wait-line .dot{width:12px;height:12px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 1.5px var(--ink);animation:pulse 900ms ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.wait-line .dot{animation:none}}

/* the end-game dialog */
.modal-veil{position:absolute;inset:0;z-index:20;background:rgba(27,45,56,.45);display:grid;place-items:center;padding:16px}
.dialog{width:min(440px,100%);background:var(--tile);border-radius:16px;padding:24px 24px 20px;box-shadow:0 0 0 1.5px var(--ink),4px 4px 0 0 var(--ink)}
.dialog h3{font-size:24px;font-weight:700}
.dialog p{margin-top:8px;font-size:17px;color:var(--ink)}
.dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag-word{font-style:italic;font-size:17px;padding:2px 10px;border-radius:6px;background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ===================== three windows side by side (template scaffolding) ===================== */
.frames{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.frame{margin:0}
.frame figcaption{font:12px/1.3 system-ui,sans-serif;color:#3D4A4F;margin:0 0 5px}
.dev-wrap{position:relative;overflow:hidden;box-shadow:0 0 0 1px #9FB0AD}
.dev-wrap .device{box-shadow:none}
html.bare .frames{display:block}
html.bare .frame figcaption{display:none}
html.bare .dev-wrap{box-shadow:none}

/* ===================== the mode, chosen on /create ===================== */
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.device[data-layout="phone"] .mode-pick{grid-template-columns:1fr}
.mode-opt{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--tile);border:0;border-radius:12px;padding:14px 16px;box-shadow:0 0 0 1.5px var(--ink);cursor:pointer;color:var(--ink);font:inherit}
.mode-opt[aria-checked="true"]{box-shadow:0 0 0 3px var(--spruce),3px 3px 0 0 var(--ink)}
.mode-opt b{font-size:19px;display:flex;align-items:center;gap:10px}
.mode-opt b::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--ink)}
.mode-opt[aria-checked="true"] b::before{background:var(--spruce);box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 4px var(--tile)}
.mode-opt span{font-size:15px;color:var(--slate);line-height:1.4}
.mode-opt:focus-visible{outline:3px solid var(--ochre);outline-offset:4px}

/* ===================== a field that is wrong: three options to choose from ===================== */
/* B: the fault is part of the field, a strip under the words it is about */
.field .field-fault{list-style:none;margin:0;padding:10px 16px 12px;border-top:1.5px solid var(--brick);background:var(--rose);border-radius:0 0 12px 12px;font-size:16px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.field-fault li{display:flex;gap:8px;align-items:baseline}
.field-fault li::before{content:"×";font-weight:700;flex:none}

/* ===================== the teacher's board ===================== */
.cell.t-a{background:var(--wash);font-style:italic;color:var(--ink)}
.cell.t-b{background:var(--stone);box-shadow:none;outline:1.5px dotted var(--ink);outline-offset:-1.5px;font-style:italic;color:var(--ink)}
.sw{display:inline-block;width:15px;height:15px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.sw.a{background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sw.b{background:var(--stone);outline:1.5px dotted var(--ink);outline-offset:-1.5px}
.word-list .row{display:flex;align-items:baseline;gap:12px;width:100%;padding:10px 2px;min-height:44px}
.word-list .open .state{color:var(--ink);font-style:italic}
.sum-head{display:flex;align-items:baseline;gap:8px;margin-top:18px}
.sum-head h3{font-size:19px;font-weight:700}

/* ===================== motion: the street wakes up ===================================
   One language for every movement, taken from the drawing rather than from a library.
   A screen opens the way a balcony does in the morning: the shutters swing open, the
   neighbours lean out, the line is thrown across, and the page settles in from below,
   one block after another. An answered word turns over square by square, like a tile
   flipped to its other face, and its card is pegged on the line and swings until it
   hangs still. A wrong answer shakes once, as a head does. A dialog lifts off the page.
   A filled crossword is a fiesta: lanterns drop in one by one and sway, confetti falls,
   the card springs up. Two curves only: --out for arriving, --spring for celebrating.
   Every rule lives inside no-preference: with reduced motion the page is simply there. */
:root{--out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: no-preference){
  .enter .rise{animation:rise 620ms var(--out) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .enter .shutter{transform-box:fill-box;animation:swing 900ms var(--out) both}
  .enter .shutter.sl{transform-origin:100% 50%}
  .enter .shutter.sr{transform-origin:0 50%}
  @keyframes swing{from{transform:scaleX(-1)}35%{transform:scaleX(-.6)}to{transform:scaleX(1)}}
  .enter .card{animation:appear 500ms ease 1250ms both}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  .enter .who{animation:lean 700ms var(--out) 420ms both}
  @keyframes lean{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .enter .line-draw{stroke-dasharray:1;animation:draw 1000ms var(--out) 700ms both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .cell.just{animation:turn 560ms var(--out) both;animation-delay:calc(var(--d,0) * 80ms)}
  @keyframes turn{from{transform:perspective(300px) rotateX(-95deg);background:var(--tile)}55%{background:var(--sage)}to{transform:none}}
  .scene .pegged{transform-box:fill-box;transform-origin:50% 0;animation:peg 1100ms var(--out) 420ms both}
  @keyframes peg{0%{opacity:0;transform:translateY(-26px) rotate(-16deg)}45%{opacity:1;transform:translateY(0) rotate(9deg)}70%{transform:rotate(-4deg)}88%{transform:rotate(1.5deg)}100%{transform:none}}
  .cell.refused{animation:shake 420ms var(--out) both}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
  .modal-veil{animation:veil 260ms ease-out both}
  @keyframes veil{from{opacity:0}to{opacity:1}}
  .dialog{animation:lift 460ms var(--out) 60ms both}
  @keyframes lift{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .field .field-fault{animation:unfold 420ms var(--out) both}
  @keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
  .msg{animation:rise 520ms var(--out) both}
  .fiesta{animation:spring 760ms var(--spring) 200ms both}
  @keyframes spring{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}
  .fiesta .flag{animation:drop 640ms var(--spring) both,sway 2.4s ease-in-out infinite alternate;animation-delay:calc(var(--k) * 70ms + 400ms),calc(var(--k) * 70ms + 1040ms)}
  .scene .lantern{transform-box:fill-box;transform-origin:50% 0;animation:drop 760ms var(--spring) both,sway 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--k) * 80ms + 300ms),calc(var(--k) * 80ms + 1060ms)}
  @keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  @keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
  .scene .confetti{animation:fall 1800ms var(--out) both;animation-delay:calc(var(--k) * 45ms + 500ms)}
  @keyframes fall{from{opacity:0;transform:translateY(-140px) rotate(-120deg)}20%{opacity:1}to{opacity:1;transform:none}}
  .btn,.mode-opt{transition:transform 160ms var(--out),box-shadow 160ms var(--out),background-color 220ms ease}
  .btn:not(.link):not(.tpl):not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:0 0 0 1.5px var(--ink),4px 4px 0 0 var(--ink)}
  .btn:not(.link):not(.tpl):not(:disabled):active{transform:translate(2px,2px);box-shadow:0 0 0 1.5px var(--ink),1px 1px 0 0 var(--ink);transition-duration:60ms}
  .mode-opt:hover{transform:translateY(-1px)}
  .word-list button{transition:background-color 200ms ease}
  .word-list button:hover{background:rgba(255,255,255,.5)}
}
</style>

<body>
<div class="tpl-bar" aria-label="Template controls (not part of the app)">
  <b>Template · Across the Street</b>
  <div class="grp"><span>Mode</span><button type="button" data-mode="pair">pair</button><button type="button" data-mode="lesson">lesson</button></div>
  <div class="grp"><span>Role</span><button type="button" data-role="host">host</button><button type="button" data-role="guest">guest</button></div>
  <div class="grp"><span>Words</span><button type="button" data-size="few">few</button><button type="button" data-size="many">many</button></div>
  <div class="grp"><span>Width</span><button type="button" data-width="all">all three</button><button type="button" data-width="1440">1440</button><button type="button" data-width="834">834</button><button type="button" data-width="375">375</button></div>
  <span class="tpl-where" id="where"></span>
</div>
<div class="tpl-body">
  <nav class="tpl-map" id="map" aria-label="The state tree (not part of the app)"></nav>
  <div class="tpl-stage">
    <div class="frames" id="stage"></div>
    <div class="tpl-note" id="stateNote"></div>
  </div>
</div>
<script>
(function () {
  "use strict";

  /* ============================ state of the template ============================ */
  var state = { key: "home", role: "host", size: "few", width: "all", mode: "pair" };
  var FEW = ["apple", "bread", "cheese", "dinner", "engine", "flower"];
  var MANY = ["apple", "bread", "cheese", "dinner", "engine", "flower", "garden", "harbour",
              "island", "jacket", "kitchen", "lantern", "morning", "needle", "orchard",
              "pattern", "quarter", "ribbon"];
  function words() { return state.size === "many" ? MANY : FEW; }
  function roomWords() { return BOARDS[state.size].words.map(function (w) { return w.text; }); }
  function isHost() { return state.role === "host"; }
  function lesson() { return state.mode === "lesson"; }
  function isTeacher() { return lesson() && isHost(); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  /* the context of the window being drawn: three are drawn at once */
  var ctx = { w: 1440, h: 900, layout: "wide", idx: 0 };
  function uid(base) { return base + "-" + ctx.idx; }

  /* ============================ copy from the code ============================ */
  var EXPLAIN_HINT = "These are written into the grid for you alone, in italics on the dashed squares. Explain each one out loud: say anything except the word itself. Tap one to find it in the grid.";
  var GUESS_HINT = "The others explain these to you. Type them into the highlighted squares, and name one by its number to ask for it again. Tap one to go to its first empty square.";
  var KEYBOARD_HINT = "The arrow keys move around the whole grid, square by square. Backspace clears the square you are in, or steps back when it is already empty.";
  var CROSSING_HINT = "Two of your words cross. On the shared square, click it again or press the space bar to swap between them.";
  var REFUSAL_LINE = "That is not the word. The letters clear in a moment. Try again as often as you like.";
  var UNAVAILABLE = {
    missing:    ["There is no game at this link", "It may have been mistyped, or the room may have been cleaned up. Rooms are kept for 24 hours.", "info"],
    expired:    ["This room has expired", "Rooms are kept for 24 hours after they are created, and this one is past that, so nobody can join it any more. Ask whoever invited you to start a new game.", "info"],
    started:    ["This game has already begun", "The words were dealt out among the players who were in the room at the time, so it takes no new players. Ask whoever invited you for a link to the next game.", "info"],
    finished:   ["This game is over", "The room has been closed. Rooms are not replayed, so there is nothing left to join here; start a new game and send the others your own link.", "info"],
    full:       ["The room is full", "This game is played by exactly two people, and this room has both of them. Start a game of your own and send its link to whoever you want to play with.", "info"],
    refused:    ["The room would not take you in", "In the moment it took to pick a nickname, somebody else may have taken the last seat or the game may have started. Start a game of your own and send its link to whoever you want to play with.", "info"],
    connection: ["Could not reach the game", "Check your connection and reload the page. The room is still there.", "error"]
  };
  var UNAVAILABLE_LESSON = {
    full:    ["This lesson is full", "A lesson is played by two players, and this room has both of them. Ask your teacher which room is yours.", "info"],
    started: ["This lesson has already begun", "The words were dealt out to the two players who were in the room at the time. Ask your teacher which room is yours.", "info"]
  };

  /* ============================ the drawing ============================
     An Andalusian street: two whitewashed houses facing each other, terracotta eaves,
     wrought-iron balconies with geraniums, azulejo tiles round the doors. A neighbour
     stands at each balcony with a tin-can telephone; the line between the cans carries
     every answered word as a tile. Between them, at the end of the street, a third
     house: its shutters stay closed in a pair game, and in a lesson the teacher watches
     from its balcony.
     The people react to the room: the one who explains talks and gestures, the one who
     listens smiles, both cheer when the crossword is full.
       left:   "here" | "empty" (nobody yet: a lesson's first lobby) | "shut" (shutters closed: a page that could not be opened)
       right:  "here" | "away" (curtains drawn) | "empty" (nobody yet) | "shut" (shutters closed)
       line:   "taut" | "slack" (ended early) | "loose" (one end only) | "none"
       mood:   "talk" | "wave" | "wait" | "cheer" | "calm"
       teacher: "here" | "away" | absent (a pair game) */
  var INK = "#1B2D38", LIT = "#F2C766", DARK = "#9DB3B6", ROSE = "#E9CBC1", STONE = "#C5D8D6",
      SPRUCE = "#2D6658", TILE = "#FAFBFA", CAN = "#E3EAE9", WASH = "#F6E3B4";
  var WHITE = "#FBF7EE", SHADE = "#EDE3D2", TERRA = "#C2603A", AZUL = "#2E5C8A", GERA = "#C8412E", POT = "#B4643C", LEAF = "#3F7A4E";
  var SKIN = ["#E9B892", "#C08A62", "#8E5E40"], HAIR = ["#3B2A20", "#1B2D38", "#A8AFB2"];
  var P0 = [196, 222], P2 = [444, 236];
  var CROPS = { full: "0 30 640 490", top: "0 40 640 312", band: "0 130 640 226" };

  function along(t, sag) {
    var P1 = [320, 300 + sag], u = 1 - t;
    return [u * u * P0[0] + 2 * u * t * P1[0] + t * t * P2[0], u * u * P0[1] + 2 * u * t * P1[1] + t * t * P2[1]];
  }
  function attr(o) { return Object.keys(o).map(function (k) { return k + '="' + o[k] + '"'; }).join(" "); }
  /* an arm drawn as a sleeve with an ink edge, ending in a hand */
  function arm(sx, sy, ex, ey, hx, hy, shirt, skin) {
    var d = "M" + sx + " " + sy + "Q" + ex + " " + ey + " " + hx + " " + hy;
    return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + shirt + '" stroke-width="7" stroke-linecap="round"/>' +
      '<circle cx="' + hx + '" cy="' + hy + '" r="5" fill="' + skin + '" stroke="' + INK + '" stroke-width="1.5"/>';
  }
  /* a person at a window, head at (x, y); `can` is where the can is held, in street coordinates */
  function person(o) {
    var f = o.facing || 1, s = (o.s || 1) * 1.12, out = '<g transform="translate(' + o.x + ' ' + o.y + ') scale(' + s + ')">';
    out += '<path d="M-25 62C-26 8 26 8 25 62Z" fill="' + o.shirt + '" stroke="' + INK + '" stroke-width="1.6"/>';
    out += '<rect x="-5" y="11" width="10" height="10" fill="' + o.skin + '" stroke="' + INK + '" stroke-width="1.4"/>';
    var sx = -f * 15, sy = 31;
    if (o.arm === "gesture") { out += arm(sx, sy, -f * 34, 30, -f * 31, 4, o.shirt, o.skin) + '<path d="M' + (-f * 31) + ' -1v-6M' + (-f * 35) + ' 0l-3-5M' + (-f * 27) + ' 0l3-5" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>'; }
    if (o.arm === "wave") { out += arm(sx, sy, -f * 36, 18, -f * 30, -14, o.shirt, o.skin); }
    if (o.arm === "cheer") { out += arm(sx, sy, -f * 34, 6, -f * 24, -30, o.shirt, o.skin); }
    if (o.arm === "rest") { out += arm(sx, sy, -f * 26, 46, -f * 8, 50, o.shirt, o.skin); }
    if (o.arm === "note") {
      out += '<rect x="-15" y="22" width="30" height="20" rx="2" fill="' + TILE + '" stroke="' + INK + '" stroke-width="1.5"/>' +
        '<path d="M-10 28h20M-10 33h20M-10 38h12" stroke="' + SLATE + '" stroke-width="1.2"/>' +
        '<circle cx="-15" cy="34" r="4.5" fill="' + o.skin + '" stroke="' + INK + '" stroke-width="1.4"/><circle cx="15" cy="34" r="4.5" fill="' + o.skin + '" stroke="' + INK + '" stroke-width="1.4"/>';
    }
    if (o.can) {
      var hx = (o.can[0] - o.x) / s, hy = (o.can[1] - o.y) / s;
      out += '<rect x="' + (hx - 6.5) + '" y="' + (hy - 8.5) + '" width="13" height="17" rx="2" fill="' + CAN + '" stroke="' + INK + '" stroke-width="1.6"/>';
      out += arm(-sx, sy, (-sx + hx) / 2 + f * 4, Math.max(sy, hy) + 12, hx - f * 5, hy + 3, o.shirt, o.skin);
    }
    /* the head */
    out += '<circle cx="0" cy="-2" r="16" fill="' + o.hair + '" stroke="' + INK + '" stroke-width="1.6"/>';
    if (o.bun) { out += '<circle cx="' + (-f * 11) + '" cy="-14" r="7" fill="' + o.hair + '" stroke="' + INK + '" stroke-width="1.6"/>'; }
    out += '<circle cx="0" cy="2" r="14" fill="' + o.skin + '" stroke="' + INK + '" stroke-width="1.6"/>';
    out += '<path d="M-14 -2Q0 -14 14 -4" fill="' + o.hair + '" stroke="none"/>';
    var ex = f * 2, ey = o.face === "think" ? -1 : 1;
    out += '<circle cx="' + (ex - 5) + '" cy="' + ey + '" r="1.9" fill="' + INK + '"/><circle cx="' + (ex + 5) + '" cy="' + ey + '" r="1.9" fill="' + INK + '"/>';
    if (o.glasses) { out += '<g fill="none" stroke="' + INK + '" stroke-width="1.3"><circle cx="' + (ex - 5) + '" cy="' + ey + '" r="4.2"/><circle cx="' + (ex + 5) + '" cy="' + ey + '" r="4.2"/><path d="M' + (ex - 0.8) + ' ' + ey + 'h1.6"/></g>'; }
    out += '<circle cx="' + (ex - 8) + '" cy="7" r="3" fill="' + ROSE + '" opacity=".8"/><circle cx="' + (ex + 8) + '" cy="7" r="3" fill="' + ROSE + '" opacity=".8"/>';
    var mx = f * 3;
    if (o.face === "talk") { out += '<ellipse cx="' + mx + '" cy="9.5" rx="3.2" ry="2.8" fill="' + INK + '"/>'; }
    else if (o.face === "grin") { out += '<path d="M' + (mx - 5.5) + ' 7.5h11q-5.5 7.5-11 0Z" fill="' + INK + '"/>'; }
    else if (o.face === "calm" || o.face === "think") { out += '<path d="M' + (mx - 3) + ' 10h6" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>'; }
    else { out += '<path d="M' + (mx - 4) + ' 8.5q4 4 8 0" fill="none" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>'; }
    return out + '</g>';
  }
  var SLATE = "#4C6170";
  var MOODS = {
    talk:  { L: ["talk", "gesture"], R: ["smile", "rest"], T: "smile" },
    wave:  { L: ["smile", "wave"], R: ["smile", "wave"], T: "smile" },
    wait:  { L: ["smile", "rest"], R: ["smile", "rest"], T: "smile" },
    cheer: { L: ["grin", "cheer"], R: ["grin", "cheer"], T: "grin" },
    calm:  { L: ["calm", "rest"], R: ["calm", "rest"], T: "calm" }
  };
  function eave(x, y, w) {
    var d = "M" + x + " " + y + "h" + w + "v8";
    for (var i = 0; i < w; i += 12) { d += "a6 6 0 0 1 -12 0"; }
    return '<path d="' + d + 'Z" fill="' + TERRA + '"/>';
  }
  function rail(x1, x2, y, h) {
    h = h || 34;
    var s = '<rect x="' + (x1 - 6) + '" y="' + (y + h) + '" width="' + (x2 - x1 + 12) + '" height="7" rx="1.5" fill="' + INK + '"/>';
    var d = "M" + x1 + " " + y + "H" + x2 + "M" + x1 + " " + (y + h - 4) + "H" + x2;
    for (var x = x1; x <= x2; x += 8) { d += "M" + x + " " + y + "V" + (y + h); }
    s += '<path d="' + d + '" fill="none" stroke-width="1.6"/><path d="M' + x1 + ' ' + y + 'H' + x2 + '" stroke-width="3.5"/>';
    for (var c = x1 + 8; h > 20 && c < x2; c += 16) { s += '<circle cx="' + c + '" cy="' + (y + 9) + '" r="3" fill="none" stroke-width="1.3"/>'; }
    return s;
  }
  function geraniums(x, y) {
    return '<path d="M' + (x - 9) + ' ' + y + 'h18l-3 14h-12Z" fill="' + POT + '"/>' +
      '<path d="M' + (x - 8) + ' ' + y + 'c2-8 6-10 8-12M' + (x + 6) + ' ' + y + 'c-1-7-3-9-6-12" fill="none" stroke="' + LEAF + '" stroke-width="2"/>' +
      '<circle cx="' + (x - 6) + '" cy="' + (y - 8) + '" r="4.5" fill="' + GERA + '"/><circle cx="' + (x + 2) + '" cy="' + (y - 13) + '" r="5" fill="' + GERA + '"/><circle cx="' + (x + 7) + '" cy="' + (y - 5) + '" r="4" fill="' + GERA + '"/>';
  }
  function wallPot(x, y) {
    return '<path d="M' + x + ' ' + (y - 8) + 'v6" stroke-width="1.3"/><path d="M' + (x - 6) + ' ' + y + 'h12l-2 10h-8Z" fill="' + AZUL + '"/>' +
      '<circle cx="' + (x - 3) + '" cy="' + (y - 3) + '" r="3" fill="' + GERA + '" stroke-width="1.2"/><circle cx="' + (x + 3) + '" cy="' + (y - 4) + '" r="3" fill="' + GERA + '" stroke-width="1.2"/>';
  }
  function azulejoDoor(x, y) {
    var s = '<rect x="' + (x - 8) + '" y="' + (y - 10) + '" width="68" height="' + (526 - y) + '" fill="' + AZUL + '"/>';
    for (var ty = y - 4; ty < 512; ty += 12) {
      s += '<rect x="' + (x - 5) + '" y="' + ty + '" width="4" height="4" fill="' + WHITE + '" stroke="none" transform="rotate(45 ' + (x - 3) + ' ' + (ty + 2) + ')"/>';
      s += '<rect x="' + (x + 53) + '" y="' + ty + '" width="4" height="4" fill="' + WHITE + '" stroke="none" transform="rotate(45 ' + (x + 55) + ' ' + (ty + 2) + ')"/>';
    }
    return s + '<path d="M' + x + ' 516v-50a26 26 0 0 1 52 0v50Z" fill="' + SPRUCE + '"/><path d="M' + (x + 26) + ' 446v70" stroke-width="1.4"/>';
  }
  function rejas(x, y, lit) {
    var d = "";
    for (var i = 8; i < 56; i += 8) { d += "M" + (x + i) + " " + y + "v78"; }
    return '<rect x="' + x + '" y="' + y + '" width="56" height="78" rx="3" fill="' + (lit ? LIT : DARK) + '"/><path d="' + d + 'M' + x + ' ' + (y + 26) + 'h56M' + x + ' ' + (y + 52) + 'h56" stroke-width="1.5"/>' +
      '<rect x="' + (x - 4) + '" y="' + (y + 78) + '" width="64" height="5" rx="1" fill="' + INK + '"/>';
  }
  function shutters(x1, x2, y1, y2) {
    var s = "";
    [[x1 - 17, x1 - 1, "sl"], [x2 + 1, x2 + 17, "sr"]].forEach(function (p) {

        '<p class="count-line" role="status">' + guessCount() + '</p></section>') + '</div>';
    var showPic = layout() !== "phone" && state.size === "few";
    var middle = (showPic ? scene({ crop: "band", cards: answeredWords(), mood: "talk", teacher: lesson() ? (variant === "teacheraway" ? "away" : "here") : "", label: "The answered words hanging on the line between the two balconies" }) : "") +
      '<div style="margin-top:' + (showPic ? 18 : 0) + 'px">' + board(mode, squareSize(layout())) + '</div>' + (leftOut ? "" : boardNotes(mode)) +
      (variant === "guessfail" ? '<div style="margin-top:14px">' + msg("error", "Your answer was not saved", "It was right, but the other player could not be told. The room may have expired. Reload the page to see where the game stands.") + '</div>' : "") +
      '<div class="row-btns" style="justify-content:center;margin-top:14px">' + tplGo("→ answer apple", "playing/answered") + tplGo("→ finish it", "finished") + tplGo("→ left out", "playing/leftout") + tplGo("→ answer refused", "playing/refused") + tplGo("→ answer failed", "playing/guessfail") + '</div>';
    /* in a lesson a player cannot end the game: only the teacher can */
    var action = (leftOut || lesson()) ? "" : (variant === "ending" ? btn("Ending the game", "link loading") : go("End the game", "playing/confirm", "link"));
    var status = leftOut ? "" : (lesson() ? "Playing with " + other() + ". " + TEACHER + " is watching." : "Playing with " + other());
    return room({ status: esc(status), action: action, left: left, right: right, middle: middle, overlay: lesson() ? "" : endDialog(variant) });
  }
  S.playing = { group: "The game", label: "Playing", note: "No title: the letters say what this is. The drawing is a band above the board: one neighbour explaining with her hands, the other listening, every answered word hanging on the line. At 375 the drawing is left out so the board is the first thing under the header; with the long word list it is left out at every width. The teacher (lesson, host) sees every word, coloured and outlined by who explains it, and the only thing they can do is end the lesson. A player in a lesson has no “End the game”.", render: function () { return playing("plain"); } };
  S["playing/answered"] = { group: "The game", sub: true, label: "…a word answered", note: "The moment “apple” is answered: its squares turn over one by one to their answered face, and its card is pegged on the line between the balconies and swings until it hangs still. The list marks it answered. Click it again to replay. With reduced motion it is simply answered.",
    render: function () { JUST = "apple"; try { return playing("plain"); } finally { JUST = null; } } };
  S["playing/leftout"] = { group: "The game", sub: true, label: "…dealt out without you", note: "Joined in the instant before the deal. Every word would read as theirs, so they are shown none.", render: function () { return playing("leftout"); } };
  S["playing/refused"] = { group: "The game", sub: true, label: "…answer refused", note: "A wrong answer turns its squares to the refused surface, struck through, and says so under the board, where the player was looking when they typed it.", render: function () { return playing("refused"); } };
  S["playing/guessfail"] = { group: "The game", sub: true, label: "…answer not saved", note: "The database refused the write outright, most likely an expired room.", render: function () { return playing("guessfail"); } };
  S["playing/away"] = { group: "The game", sub: true, label: "…you are away", note: "The same notice the lobby gives, first in the zone with the players.", render: function () { return playing("away"); } };
  S["playing/teacheraway"] = { group: "The game", sub: true, label: "…teacher away (lesson)", lessonOnly: true, note: "A lesson only, seen by a player. The game goes on; the teacher's balcony has its curtains drawn, and the room expires with its lifetime if they never come back.", render: function () { return playing("teacheraway"); } };
  S["playing/confirm"] = { group: "The game", sub: true, label: "…end it? (dialog)", note: "The one irreversible thing, so it asks. “End it” is the quiet button and “Keep playing” (for the teacher, “Keep watching”) the loud one. In a lesson only the teacher sees it.", render: function () { return playing("confirm"); } };
  S["playing/ending"] = { group: "The game", sub: true, label: "…ending it", note: "The control says what it is doing, beats, and takes no second press.", render: function () { return playing("ending"); } };
  S["playing/endfail"] = { group: "The game", sub: true, label: "…could not end it", note: "Not retried on its own: ending was a person's decision.", render: function () { return playing("endfail"); } };

  function fiestaCard(headline, text, withWords) {
    var flags = [GERA, LIT, AZUL, TILE, LEAF, "#E58A3A", LIT, AZUL, TILE, LEAF];
    return '<section class="fiesta" role="status"><div class="flags" aria-hidden="true">' + flags.map(function (c, i) { return '<span class="flag" style="background:' + c + ';--k:' + i + '"></span>'; }).join("") + '</div>' +
      '<h2 class="ole">' + esc(headline) + '</h2><p>' + esc(text) + '</p>' +
      (withWords ? '<div class="tags">' + roomWords().map(function (w) { return '<span class="tag-word">' + esc(w) + '</span>'; }).join("") + '</div>' : '') + '</section>';
  }
  S.finished = { group: "The game", label: "Finished", note: "A fiesta, the way an Andalusian street throws one: farolillos strung between the balconies and swaying, confetti, both neighbours cheering (the teacher too, in a lesson), every word on the line and every square of the board answered. The card is fiesta red with white polka dots and a row of flags, and says “You did it!” in the language of the interface, which is English today: the style is Spanish, the words are the app's own (Viktor, 2026-10-14). No score. With reduced motion nothing sways.",
    render: function () {
      var n = roomWords().length, middle = scene({ crop: "band", cards: roomWords(), mood: "cheer", fiesta: true, label: "A fiesta in the street: paper lanterns and confetti, both neighbours cheering, every word hanging on the line" }) +
        '<div style="margin-top:18px">' + board("all", squareSize(layout())) + '</div>';
      if (isTeacher()) {
        return room({ home: true, status: "The lesson is finished", left: fiestaCard("They did it!", "Your players finished the crossword together: all " + n + " of its words.", false) + '<div style="margin-top:22px">' + lessonSummary(true) + '</div><div style="margin-top:18px">' + go("Start a new lesson", "create") + '</div>', middle: middle, right: players() });
      }
      var summary = "You finished the crossword together: all " + n + " of its words, between the 2 of you.";
      return room({ home: true, status: lesson() ? "The lesson is finished" : "The game is finished",
        left: fiestaCard("You did it!", summary, true) +
          '<div style="margin-top:18px">' + go("Start a new game", "home") + '</div>',
        middle: middle, right: players() });
    } };
  S["closed-early"] = { group: "The game", label: "Ended early", note: "Not celebrated: the neighbours are calm and the line sags, holding only what was answered. The teacher's summary says which words were not answered, because those are what the next lesson is about.",
    render: function () {
      var n = roomWords().length, line = "Of the " + n + " words, the ones that were answered are in place; the rest stay blank.";
      if (isTeacher()) {
        return room({ home: true, status: "The lesson was ended", left: lessonSummary(false) + '<div style="margin-top:18px">' + go("Start a new lesson", "create", "quiet") + '</div>',
          middle: scene({ crop: "band", line: "slack", cards: answeredWords(), mood: "calm", label: "A sagging line between the balconies, holding only the answered words" }) +
            '<div style="margin-top:12px">' + board("teacher", squareSize(layout())) + '</div>' + teacherLegend(), right: players() });
      }
      return room({ home: true, status: lesson() ? "The lesson was ended" : "The game was ended",
        left: msg("info", lesson() ? TEACHER + " ended the lesson" : "This game was ended early", (lesson() ? "Your teacher ended it" : "It was ended") + " before every word had been answered, and the room is closed for good. The words nobody guessed are not spelled out, apart from the ones that were yours to explain.") +
          '<div style="margin-top:18px">' + go("Start a new game", "home", "quiet") + '</div>',
        middle: scene({ crop: "band", line: "slack", cards: answeredWords(), mood: "calm", label: "A sagging line between the balconies, holding only the words that were answered" }) +
          '<p class="hint" style="text-align:center;margin-top:14px">' + esc(line) + '</p>' +
          '<div style="margin-top:12px">' + board("closed", squareSize(layout())) + '</div>',
        right: players() });
    } };

  /* ============================ the map ============================ */
  var ORDER = ["home", "create", "create/errors", "create/nogrid", "create/unplaced", "create/creating", "create/failed",
    "connecting", "join", "join/joining", "join/failed",
    "unavailable/missing", "unavailable/expired", "unavailable/started", "unavailable/finished", "unavailable/full", "unavailable/refused", "unavailable/connection", "reload", "crash",
    "lobby", "lobby/waiting", "lobby/copied", "lobby/copyfailed", "lobby/crowded", "lobby/starting", "lobby/failed", "lobby/away", "lobby/nostudent", "lobby/teacheraway",
    "playing", "playing/answered", "playing/leftout", "playing/refused", "playing/guessfail", "playing/away", "playing/teacheraway", "playing/confirm", "playing/ending", "playing/endfail",
    "finished", "closed-early"];
  var mapEl = document.getElementById("map"), stageEl = document.getElementById("stage");
  var whereEl = document.getElementById("where"), noteEl = document.getElementById("stateNote");
  function buildMap() {
    var html = '<p class="map-head">The state tree</p>', group = null;
    ORDER.forEach(function (key) {
      var s = S[key];
      if (s.group !== group) { group = s.group; html += '<p class="map-group">' + esc(group) + '</p>'; }
      html += '<button type="button" class="node' + (s.sub ? " sub" : "") + '" data-go="' + key + '">' + esc(s.label) + '</button>';
    });
    mapEl.innerHTML = html;
  }

  /* ============================ the windows ============================ */
  var WINDOWS = { "1440": [1440, 900], "834": [834, 1112], "375": [375, 812] };
  var params = new URLSearchParams(window.location.search), isBare = params.has("bare");
  if (params.get("state") && S[params.get("state")]) { state.key = params.get("state"); }
  if (params.get("role") === "guest") { state.role = "guest"; }
  if (params.get("size") === "many") { state.size = "many"; }
  if (params.get("mode") === "lesson") { state.mode = "lesson"; }
  if (WINDOWS[params.get("width")]) { state.width = params.get("width"); }
  if (isBare) { document.documentElement.classList.add("bare"); }
  function layoutFor(w) { return w >= 1200 ? "wide" : (w >= 768 ? "tablet" : "phone"); }
  function windows() {
    if (isBare) { return [{ w: window.innerWidth, h: window.innerHeight, name: "" }]; }
    var keys = state.width === "all" ? ["1440", "834", "375"] : [state.width];
    return keys.map(function (k) { return { w: WINDOWS[k][0], h: WINDOWS[k][1], name: k + " × " + WINDOWS[k][1] }; });
  }
  function remember() {
    var q = [];
    if (isBare) { q.push("bare"); }
    q.push("state=" + state.key);
    if (state.mode !== "pair") { q.push("mode=" + state.mode); }
    if (state.role !== "host") { q.push("role=" + state.role); }
    if (state.size !== "few") { q.push("size=" + state.size); }
    if (!isBare && state.width !== "all") { q.push("width=" + state.width); }
    try { history.replaceState(null, "", "?" + q.join("&")); } catch (error) { console.warn("Could not keep the state in the address", error); }
  }

  /* ============================ render ============================ */
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)"), lastScreen = null;
  function render() {
    var s = S[state.key] || S.home, saved = { mode: state.mode, role: state.role };
    if (s.lessonOnly) { state.mode = "lesson"; state.role = "guest"; }
    if (s.teacherOnly) { state.mode = "lesson"; state.role = "host"; }
    var scr = state.key.split("/")[0], anim = lastScreen !== scr ? " enter" : "";
    var wins = windows(), scale = isBare ? 1 : Math.min(1, (stageEl.clientWidth - 2) / wins[0].w);
    var html = wins.map(function (win, i) {
      ctx = { w: win.w, h: win.h, layout: layoutFor(win.w), idx: i };
      var w = Math.round(win.w * scale), h = Math.round(win.h * scale);
      return '<figure class="frame"><figcaption>' + esc(win.name) + '</figcaption><div class="dev-wrap" style="width:' + w + 'px;height:' + h + 'px">' +
        '<div class="device" data-layout="' + ctx.layout + '" style="--device-w:' + win.w + 'px;--device-h:' + win.h + 'px;--device-scale:' + scale + '">' +
        '<div class="screens"><div class="screen' + anim + '">' + s.render() + '</div></div></div></div></figure>';
    }).join("");
    state.mode = saved.mode; state.role = saved.role;
    stageEl.innerHTML = html;
    Array.prototype.forEach.call(stageEl.querySelectorAll(".screen"), function (el) {
      el.style.overflowY = el.querySelector(".modal-veil") ? "hidden" : "";
      ["header.app-head", ".zones > *", ".lobby-grid > *", ".column > .scene", ".column .stack > *", ".street > *", ".lobby-grid .stack > *"].forEach(function (sel) {
        Array.prototype.forEach.call(el.querySelectorAll(sel), function (node, i) { node.classList.add("rise"); node.style.setProperty("--i", String(i)); });
      });
    });
    lastScreen = scr;
    whereEl.textContent = state.key + " · " + state.mode + " · " + state.role + " · " + state.size + " · " + (isBare ? "bare" : state.width);
    noteEl.innerHTML = "<p><strong>" + esc(s.label.replace(/^…/, "")) + ".</strong> " + esc(s.note) + "</p>";
    Array.prototype.forEach.call(mapEl.querySelectorAll(".node"), function (n) { n.classList.toggle("here", n.getAttribute("data-go") === state.key); });
    syncToggles();
    remember();
  }
  function syncToggles() {
    [["data-mode", state.mode], ["data-role", state.role], ["data-size", state.size], ["data-width", state.width]].forEach(function (p) {
      Array.prototype.forEach.call(document.querySelectorAll(".tpl-bar [" + p[0] + "]"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute(p[0]) === p[1])); });
    });
    document.querySelector('[data-role="host"]').textContent = lesson() ? "teacher" : "host";
    document.querySelector('[data-role="guest"]').textContent = lesson() ? "player" : "guest";
  }
  document.addEventListener("click", function (e) {
    var pick = e.target.closest("[data-pick]");
    if (pick && !pick.disabled) { state.mode = pick.getAttribute("data-pick"); state.role = "host"; render(); return; }
    var t = e.target.closest("[data-go]");
    if (!t || !S[t.getAttribute("data-go")]) { return; }
    e.preventDefault();
    state.key = t.getAttribute("data-go");
    render();
  });
  [["data-mode", "mode"], ["data-role", "role"], ["data-size", "size"], ["data-width", "width"]].forEach(function (p) {
    Array.prototype.forEach.call(document.querySelectorAll(".tpl-bar [" + p[0] + "]"), function (b) {
      b.addEventListener("click", function () { state[p[1]] = b.getAttribute(p[0]); lastScreen = null; render(); });
    });
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { lastScreen = null; render(); }, 120); });
  buildMap();
  render();
})();
</script>
</body>
</html>
