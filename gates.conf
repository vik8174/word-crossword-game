# The release gates of Across the Street, agreed with Viktor on 2026-11-01.
# Read and run by scripts/release-gates.sh; the contract in CLAUDE.md points here.
#
# A `pr` check runs on every pull request (CI runs each as its own job) and
# before every release; a `release` check runs only before a release.
# Removing a check, lowering a threshold or emptying a gate is Viktor's
# decision (TRIAL, reference/gates.md, "No waiver").
#
# gate       | check              | when    | command

# Quality: the code is lint-clean, tested to the floor, builds, and plays end to end.
quality     | lint               | pr      | pnpm lint
quality     | test               | pr      | pnpm test
quality     | coverage           | pr      | pnpm test:coverage
quality     | build              | pr      | pnpm build
quality     | e2e                | pr      | pnpm test:e2e
quality     | visual-on-ci       | release | scripts/gate-merged-pr-green.sh Lint Test Coverage Build Rules E2E Visual

# Security: the rules hold, nothing a player downloads is known to be vulnerable,
# and no build that is deployed carries a source map or the emulator hook.
security    | firestore-rules    | pr      | pnpm test:rules
security    | audit-prod-high    | release | pnpm audit --prod --audit-level high
security    | no-source-maps     | pr      | pnpm --filter web exec node scripts/assert-no-source-maps.mjs
security    | no-emulator-leak   | pr      | pnpm check:emulator-leak

# Performance: the first visit stays under its ceilings (218.0 KiB, latin-ext
# 60.0 KiB; apps/web/build/first-visit-weight.ts, run by vite build), and
# Lighthouse meets its CI-calibrated thresholds (apps/web/lighthouserc.cjs).
performance | first-visit-weight | pr      | pnpm --filter web exec vite build
performance | lighthouse-on-ci   | release | scripts/gate-merged-pr-green.sh Lighthouse
